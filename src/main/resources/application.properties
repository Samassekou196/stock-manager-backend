spring.application.name=stock-manager
server.port=${PORT:8080}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Africa/Abidjan
server.error.include-message=never

spring.profiles.default=local
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
server.servlet.session.cookie.name=STOCKSESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:Lax}
app.security.cookie-secure=${SESSION_COOKIE_SECURE:false}
app.security.cookie-same-site=${SESSION_COOKIE_SAME_SITE:Lax}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.bootstrap.admin.username=${APP_BOOTSTRAP_ADMIN_USERNAME:}
app.bootstrap.admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap.admin.name=${APP_BOOTSTRAP_ADMIN_NAME:Administrateur}
spring.liquibase.enabled=${SPRING_LIQUIBASE_ENABLED:true}
